[workspace]
name = "yapyap-head-tracking"
version = "0.0.0"
description = "Head tracking mod for YAPYAP using CameraUnlock shared library"
channels = ["conda-forge"]
platforms = ["win-64"]

[tasks]
update-submodule = "git submodule update --remote cameraunlock-core && powershell -NoProfile -ExecutionPolicy Bypass -File cameraunlock-core/scripts/update-submodule.ps1"
sync = "git submodule update --remote cameraunlock-core"
# Manual: refresh vendored BepInEx from upstream within pinned range. Dev runs
# this when bumping the bundled version, then commits. CI never refreshes.
update-deps = "powershell -ExecutionPolicy Bypass -File scripts/update-deps.ps1"
# BepInEx.dll and 0Harmony.dll out of the committed vendor zip.
setup-loader = "powershell -ExecutionPolicy Bypass -File scripts/setup-libs.ps1"
# Unity reference stubs, compiled from the shared sources in the core submodule so
# every mod builds against one copy of them. Runs after setup-loader, which clears
# libs/ before repopulating it.
setup = { cmd = "powershell -ExecutionPolicy Bypass -File cameraunlock-core/csharp/stubs/build-unity-stubs.ps1 -OutputPath src/YapyapHeadTracking/libs -TargetFramework net48", depends-on = ["setup-loader"] }
restore = { cmd = "dotnet restore src/YapyapHeadTracking/YapyapHeadTracking.csproj", depends-on = ["setup"] }
build = { cmd = "dotnet build src/YapyapHeadTracking/YapyapHeadTracking.csproj -c Release -m:1", depends-on = ["restore"] }
# Checks that every member reference the build emits resolves against the
# assemblies it binds to at runtime. Stub/engine shape drift (a property
# declared as a field, or the reverse) compiles cleanly and only fails in
# game. Needs the game installed; skips and succeeds without it.
verify-refs = { cmd = "powershell -ExecutionPolicy Bypass -File cameraunlock-core/scripts/verify-assembly-refs.ps1 -GameId yapyap -BuildDir src/YapyapHeadTracking/bin/Release", depends-on = ["build"] }
install = { cmd = "powershell -ExecutionPolicy Bypass -File scripts/deploy.ps1 Release", depends-on = ["build"] }
# The installer contract checks, then the config tests, among them the differential test in
# tests/config_differential, which holds the legacy import to the v0.2.0 reader it replaces on
# every published build's first-run file and on core's mutation corpus, then core's canonical
# config lint over the committed file and every file the test migrated.
test = { cmd = "powershell -ExecutionPolicy Bypass -File scripts/test-installer-contract.ps1 && powershell -ExecutionPolicy Bypass -File scripts/test-find-game-output.ps1 && dotnet test tests/YapyapHeadTracking.Tests/YapyapHeadTracking.Tests.csproj -c Release && node tests/config_differential/lint-migrated.mjs tests/YapyapHeadTracking.Tests/bin/Release/net48/migrated", depends-on = ["build"] }
# Rewrites config/CameraUnlock.ini from the config table after a change to a row, a comment or a
# default. The render test compares the two on every `pixi run test`, so the committed file cannot
# drift from the code.
render-config = { cmd = "dotnet test tests/YapyapHeadTracking.Tests/YapyapHeadTracking.Tests.csproj -c Release --filter FullyQualifiedName~ConfigTests.CommittedFileIsTheRenderedDefaults && node cameraunlock-core/scripts/encode-seed.mjs", env = { CAMERAUNLOCK_RENDER_CONFIG = "write" }, depends-on = ["build"] }
package = { cmd = "powershell -ExecutionPolicy Bypass -File scripts/package-release.ps1", depends-on = ["test"] }
uninstall = "scripts\\uninstall.cmd /y"
clean = "dotnet clean src/YapyapHeadTracking/YapyapHeadTracking.csproj"
release = "powershell -ExecutionPolicy Bypass -File scripts/release.ps1"
# Checks the launcher contract against the built installer ZIP, and that the Nexus ZIP carries
# no config.
validate-manifest = "node cameraunlock-core/scripts/validate-manifest.mjs"

[dependencies]
# Node runs the canonical config lint in `test`, which `package` depends on, and
# validate-manifest. Pinned to the release cameraunlock-core's own lock resolves.
nodejs = "==26.5.0"
