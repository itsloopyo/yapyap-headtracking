name: Release
run-name: "Release ${{ github.ref_name }}"

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Build and Publish Release
    runs-on: windows-latest

    steps:
      - name: Require Discord release webhook
        shell: pwsh
        env:
          DISCORD_RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
        run: |
          if (-not $env:DISCORD_RELEASE_WEBHOOK) {
            Write-Host "::error::DISCORD_RELEASE_WEBHOOK secret is not set - every release must be announced to Discord, so this run is refused before the release is created. Set it with 'gh secret set DISCORD_RELEASE_WEBHOOK --repo ${{ github.repository }}' and re-run."
            exit 1
          }
          Write-Host "Discord release webhook is configured."

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Extract version from tag
        id: version
        shell: pwsh
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          $tag = $env:TAG_NAME
          if ($tag -notmatch '^v(\d+\.\d+\.\d+)$') {
            Write-Host "::error::Tag '$tag' must match v1.2.3"
            exit 1
          }

          $version = $Matches[1]
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Release version: $version"

      - name: Validate version matches csproj
        shell: pwsh
        run: |
          [xml]$project = Get-Content src/YapyapHeadTracking/YapyapHeadTracking.csproj
          $projectVersion = $project.Project.PropertyGroup |
            Where-Object { $_.Version } |
            Select-Object -First 1 -ExpandProperty Version

          if ($projectVersion -ne "${{ steps.version.outputs.version }}") {
            Write-Host "::error::Tag version ${{ steps.version.outputs.version }} does not match csproj version $projectVersion"
            exit 1
          }

          Write-Host "Version matches src/YapyapHeadTracking/YapyapHeadTracking.csproj"

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.9.6
        with:
          run-install: false

      - name: Build and package
        shell: pwsh
        run: pixi run package

      - name: Generate release notes
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File cameraunlock-core/scripts/generate-release-notes.ps1 `
            -Version "${{ steps.version.outputs.version }}" `
            -ProjectName "Head Tracking for YAPYAP" `
            -OutputFile release-notes.txt `
            -ArtifactPaths @(
              "src/YapyapHeadTracking/",
              "cameraunlock-core/",
              "scripts/install.cmd",
              "scripts/uninstall.cmd"
            )

      - name: Find release ZIPs
        id: release-zips
        shell: pwsh
        run: |
          $installerZip = Get-ChildItem -Path release -Filter '*-installer.zip' | Select-Object -First 1
          $nexusZip = Get-ChildItem -Path release -Filter '*-nexus.zip' | Select-Object -First 1

          if (-not $installerZip) {
            Write-Host "::error::No installer ZIP found in release/"
            exit 1
          }

          if (-not $nexusZip) {
            Write-Host "::error::No nexus ZIP found in release/"
            exit 1
          }

          "installer=$($installerZip.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "nexus=$($nexusZip.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Installer ZIP: $($installerZip.Name)"
          Write-Host "Nexus ZIP: $($nexusZip.Name)"

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create $env:TAG_NAME `
            --title "Head Tracking for YAPYAP $($env:TAG_NAME)" `
            --notes-file release-notes.txt `
            "${{ steps.release-zips.outputs.installer }}" `
            "${{ steps.release-zips.outputs.nexus }}"

      - name: Announce release to Discord
        shell: pwsh
        env:
          DISCORD_RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
        run: |
          if (-not $env:DISCORD_RELEASE_WEBHOOK) {
            Write-Host "::error::DISCORD_RELEASE_WEBHOOK secret is not set - the release was created but not announced. Set it with 'gh secret set DISCORD_RELEASE_WEBHOOK --repo ${{ github.repository }}' and re-run this job."
            exit 1
          }
          $tag  = "${{ github.ref_name }}"
          $repo = "${{ github.repository }}"
          $name = (Get-Culture).TextInfo.ToTitleCase(((($repo -split '/')[-1]) -replace '-head-?tracking$','' -replace '-',' '))
          $url  = "https://github.com/$repo/releases/tag/$tag"
          $payload = @{
            username = 'Mod Releases'
            embeds   = @(@{
              title       = "$name Head Tracking $tag"
              url         = $url
              description = "A new release of **$name Head Tracking** is live.`n`n**[Download the $tag release]($url)**"
              color       = 5814783
            })
          } | ConvertTo-Json -Depth 5
          Invoke-RestMethod -Uri $env:DISCORD_RELEASE_WEBHOOK -Method Post -ContentType 'application/json' -Body $payload
          Write-Host "Announced $tag to Discord."
